import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace = "ru.rustore.unitysdk.billingclient"

    compileSdkVersion = 34
    buildToolsVersion = "35.0.1"

    defaultConfig {
        minSdk = 24
        targetSdk = 34
        versionCode = sdk_version_code
        versionName = "${rustore_billingclient_version}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation sdk_billingclient_dependency
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

def copyAARRelease = tasks.register('copyAARRelease', Copy) {
    from    (layout.buildDirectory.dir("outputs/aar"))
    include ("${project.name}-release.aar")
    into    (rootProject.layout.projectDirectory.dir("${destination_project}/Runtime/Android"))
    rename  ("${project.name}-release.aar", "${project.name}.aar")
}

def generateDependenciesXml = tasks.register('generateDependenciesXml') {
    doLast {
        try {
            def outputFile = rootProject.layout.projectDirectory
                    .file("${destination_project}/Editor/BillingClientDependencies.xml").asFile
            outputFile.parentFile.mkdirs()
            def writer = new StringWriter()
            def xml = new MarkupBuilder(writer)
            xml.dependencies {
                androidPackages {
                    androidPackage(spec: sdk_billingclient_dependency) {
                        xml.repositories {
                            repository(sdk_maven_repos)
                        }
                    }
                    androidPackage(spec: sdk_kotlin_jdk_dependency)
                }
            }
            outputFile.write(writer.toString() + '\n', 'UTF-8')
        } catch (Exception e) {
            logger.error("generateDependenciesXml: failed to generate XML", e)
        }
    }
}

afterEvaluate {
    assembleRelease.finalizedBy('copyAARRelease', 'generateDependenciesXml')
}
